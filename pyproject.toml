[build-system]
# 77 is the first setuptools that understands PEP 639 -- an SPDX ``license``
# string plus ``license-files``.  Older releases reject the string form outright,
# so the floor is a real requirement rather than a preference.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qedloop"
version = "0.1.0"
description = "An AI-driven, self-iterating software development loop: 5 phases x 3 agents over one state bus"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "jiubook", email = "jiubook@vip.qq.com" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jiubook/QEDLoop"
Repository = "https://github.com/jiubook/QEDLoop"
Issues = "https://github.com/jiubook/QEDLoop/issues"

[project.optional-dependencies]
llm = []
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
qedloop = "qedloop.cli:main"

[tool.setuptools]
packages = ["qedloop", "qedloop.phases"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
